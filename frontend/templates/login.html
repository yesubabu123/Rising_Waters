<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rising Waters Login</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f3f8ff; color: #123; margin: 0; padding: 40px; }
      .card { max-width: 420px; margin: 0 auto; background: white; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
      input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #cbd5e1; border-radius: 8px; }
      button { background: #0f6cbd; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
      .hint { color: #4b5563; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🌊 Rising Waters</h2>
      <p>Flood prediction dashboard</p>
      {% if error %}<p style="color:#b91c1c">{{ error }}</p>{% endif %}
      <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" placeholder="Enter username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter password" required>
        <button type="submit">Login</button>
      </form>
      <p class="hint">Model status: {{ model_status }}</p>
    </div>
  </body>
</html>
