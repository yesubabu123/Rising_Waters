<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rising Waters — Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <div class="container login-page">
      <div class="card card-center">
        <h1>🌊 Create an account</h1>
        <p class="hero-subtitle">Sign up to start using the flood risk dashboard.</p>
        {% if error %}
          <div class="alert">{{ error }}</div>
        {% endif %}
        <form method="post" class="form-stack">
          <label for="username">Username</label>
          <input id="username" name="username" placeholder="Enter username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" required>
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm password" required>
          <div class="form-actions">
            <button type="submit">Sign Up</button>
            <a class="button button-secondary" href="/login">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
